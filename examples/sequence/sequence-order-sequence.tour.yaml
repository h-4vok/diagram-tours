version: 1
title: Order Sequence
diagram: ./sequence-order-sequence.mmd

steps:
  - focus:
      - customer
    text: >
      {{customer}} starts an order with {{checkout}}. The note gives context without becoming a focus target.

  - focus:
      - submit_order
    text: >
      {{submit_order}} opens the exchange and activates {{checkout}}.

  - focus:
      - reserve_inventory
      - inventory_reserved
    text: >
      {{reserve_inventory}} asks {{inventory}} to reserve stock. The response inside the alt frame is a separate target.

  - focus:
      - enqueue_fulfillment
    text: >
      {{enqueue_fulfillment}} sends authorized work to {{fulfillment}} inside the opt frame.

  - focus:
      - delivery_status
    text: >
      {{delivery_status}} repeats while the loop frame waits for delivery acceptance.
